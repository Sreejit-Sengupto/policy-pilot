id: scheme_eligibility_flow
namespace: dev
inputs:
  - id: user_details
    type: STRING
    defaults: '{"gender": "Male", "age": 30, "marital_status": "Single", "state": "Karnataka", "area": "Urban", "category": "General", "pwd": "No", "minority": "No", "student": "No", "bpl": "No"}'

tasks:
  - id: eligibility_agent
    type: io.kestra.plugin.ai.agent.AIAgent
    provider: 
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: "gemini-2.5-flash"
      apiKey: "{{ kv('GEMINI_API_KEY') }}"
    tools:
      - type: io.kestra.plugin.ai.tool.TavilyWebSearch
        apiKey: "{{ kv('TAVILY_API_KEY') }}"
    prompt: |
      Given the user profile {{ inputs.user_details }}, find relevant government schemes from myscheme.gov.in using search.
      Return the result as a JSON list of scheme names and brief descriptions.

  - id: document_agent
    type: io.kestra.plugin.ai.agent.AIAgent
    provider: 
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: "gemini-2.5-flash"
      apiKey: "{{ kv('GEMINI_API_KEY') }}"
    tools:
      - type: io.kestra.plugin.ai.tool.TavilyWebSearch
        apiKey: "{{ kv('TAVILY_API_KEY') }}"
    prompt: |
      For the schemes listed below, find required documents and how to procure them using search.
      Schemes: {{ outputs.eligibility_agent.textOutput }}
      Return the result as a structured JSON.

  - id: timeline_agent
    type: io.kestra.plugin.gemini.TextCompletion
    apiKey: "{{ kv('GEMINI_API_KEY') }}"
    model: "gemini-2.5-flash"
    prompt: |
      Create a timeline for applying to these schemes based on the documents required.
      Documents: {{ outputs.document_agent.textOutput }}
      Return the result as a markdown formatted timeline.